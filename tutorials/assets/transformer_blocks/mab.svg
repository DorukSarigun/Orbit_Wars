<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">MAB Multihead Attention Block</title>
  <desc id="desc">MAB uses a query set X and a key-value set Y. Query order is equivariant and key-value order is invariant.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 12; }
      .query { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.4; rx: 10; }
      .kv { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; rx: 10; }
      .attn { fill: #fef3c7; stroke: #d97706; stroke-width: 1.4; rx: 12; }
      .out { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 1.4; rx: 10; }
      .txt { font: 600 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .math { font: 15px "DejaVu Sans Mono", Consolas, monospace; fill: #1e293b; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1100" height="360"/>
  <rect class="panel" x="24" y="24" width="1052" height="312"/>

  <text class="txt" x="50" y="60">MAB: Multihead Attention Block</text>
  <text class="small" x="50" y="86">Bir query seti, başka bir key/value setini okur.</text>

  <rect class="query" x="60" y="118" width="150" height="70"/>
  <text class="txt" x="95" y="146">Query set</text>
  <text class="math" x="126" y="169">X</text>

  <rect class="kv" x="60" y="232" width="150" height="70"/>
  <text class="txt" x="91" y="260">KV set</text>
  <text class="math" x="126" y="283">Y</text>

  <rect class="query" x="280" y="118" width="120" height="54"/>
  <text class="txt" x="320" y="151">Q</text>
  <line class="arrow" x1="210" y1="153" x2="280" y2="145"/>

  <rect class="kv" x="280" y="215" width="120" height="54"/>
  <text class="txt" x="323" y="248">K</text>
  <line class="arrow" x1="210" y1="266" x2="280" y2="242"/>

  <rect class="kv" x="280" y="280" width="120" height="54"/>
  <text class="txt" x="323" y="313">V</text>
  <line class="arrow" x1="210" y1="266" x2="280" y2="306"/>

  <rect class="attn" x="470" y="150" width="210" height="130"/>
  <text class="txt" x="526" y="183">Attention</text>
  <text class="math" x="492" y="215">softmax(QK^T / sqrt(d)) V</text>
  <text class="small" x="507" y="245">residual + LayerNorm + FFN</text>

  <line class="arrow" x1="400" y1="145" x2="470" y2="180"/>
  <line class="arrow" x1="400" y1="242" x2="470" y2="215"/>
  <line class="arrow" x1="400" y1="307" x2="470" y2="248"/>

  <rect class="out" x="750" y="170" width="160" height="90"/>
  <text class="txt" x="779" y="202">Output</text>
  <text class="math" x="776" y="229">MAB(X, Y)</text>
  <text class="small" x="770" y="249">X ile aynı adet token</text>
  <line class="arrow" x1="680" y1="215" x2="750" y2="215"/>

  <rect class="panel" x="930" y="108" width="120" height="194"/>
  <text class="txt" x="956" y="138">Simetri</text>
  <text class="small" x="944" y="168">X permute ise</text>
  <text class="small" x="944" y="188">çıktı permute.</text>
  <text class="small" x="944" y="226">Y permute ise</text>
  <text class="small" x="944" y="246">çıktı aynı kalır.</text>
  <text class="math" x="944" y="282">MAB(PX,Y)=PZ</text>
</svg>
