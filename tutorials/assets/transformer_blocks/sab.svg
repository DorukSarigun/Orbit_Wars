<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
  <title id="title">SAB Self-Attention Block</title>
  <desc id="desc">SAB is MAB applied to the same set as query, key and value. It is permutation equivariant.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 12; }
      .tok1 { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.4; rx: 10; }
      .tok2 { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; rx: 10; }
      .tok3 { fill: #fef3c7; stroke: #d97706; stroke-width: 1.4; rx: 10; }
      .block { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 1.4; rx: 14; }
      .txt { font: 600 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .math { font: 15px "DejaVu Sans Mono", Consolas, monospace; fill: #1e293b; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); opacity: .75; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="340"/>
  <rect class="panel" x="24" y="24" width="1052" height="292"/>

  <text class="txt" x="50" y="60">SAB: Self-Attention Block</text>
  <text class="small" x="50" y="86">MAB'in aynı set üzerinde kullanılması: SAB(X) = MAB(X, X)</text>

  <rect class="tok1" x="60" y="128" width="94" height="48"/>
  <text class="small" x="82" y="157">planet A</text>
  <rect class="tok2" x="60" y="188" width="94" height="48"/>
  <text class="small" x="82" y="217">planet B</text>
  <rect class="tok3" x="60" y="248" width="94" height="48"/>
  <text class="small" x="82" y="277">planet C</text>
  <text class="math" x="85" y="115">X seti</text>

  <rect class="block" x="330" y="150" width="250" height="120"/>
  <text class="txt" x="388" y="184">MAB(X, X)</text>
  <text class="small" x="366" y="214">Her token diğer tokenları okur</text>
  <text class="math" x="381" y="244">Q,K,V aynı setten</text>
  <path class="loop" d="M380 152 C390 110, 520 110, 532 152"/>

  <line class="arrow" x1="154" y1="152" x2="330" y2="180"/>
  <line class="arrow" x1="154" y1="212" x2="330" y2="210"/>
  <line class="arrow" x1="154" y1="272" x2="330" y2="240"/>

  <rect class="tok1" x="760" y="128" width="120" height="48"/>
  <text class="small" x="794" y="157">A'</text>
  <rect class="tok2" x="760" y="188" width="120" height="48"/>
  <text class="small" x="794" y="217">B'</text>
  <rect class="tok3" x="760" y="248" width="120" height="48"/>
  <text class="small" x="794" y="277">C'</text>
  <text class="math" x="767" y="115">SAB(X)</text>
  <line class="arrow" x1="580" y1="210" x2="760" y2="210"/>

  <rect class="panel" x="910" y="138" width="138" height="118"/>
  <text class="txt" x="936" y="168">Garanti</text>
  <text class="math" x="926" y="198">SAB(PX)=P SAB(X)</text>
  <text class="small" x="927" y="228">set-to-set equivariant</text>
</svg>
