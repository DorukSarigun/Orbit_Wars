<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
  <title id="title">Attention and Action Masks</title>
  <desc id="desc">Masks remove padded keys from attention and illegal actions from logits before softmax.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 12; }
      .cell { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; }
      .pad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1; }
      .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; }
      .logit { fill: #fef3c7; stroke: #d97706; stroke-width: 1.3; rx: 8; }
      .txt { font: 600 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .math { font: 15px "DejaVu Sans Mono", Consolas, monospace; fill: #1e293b; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1100" height="350"/>
  <rect class="panel" x="24" y="24" width="1052" height="302"/>

  <text class="txt" x="50" y="60">Mask: padding ve illegal action temizliği</text>
  <text class="small" x="50" y="86">Mask parametre öğrenmez; softmax öncesi geçersiz seçenekleri sıfır olasılığa indirir.</text>

  <text class="txt" x="70" y="126">Attention score matrisi</text>
  <g transform="translate(78,145)">
    <rect class="cell" x="0" y="0" width="42" height="34"/><rect class="cell" x="42" y="0" width="42" height="34"/><rect class="cell" x="84" y="0" width="42" height="34"/><rect class="pad" x="126" y="0" width="42" height="34"/>
    <rect class="cell" x="0" y="34" width="42" height="34"/><rect class="cell" x="42" y="34" width="42" height="34"/><rect class="cell" x="84" y="34" width="42" height="34"/><rect class="pad" x="126" y="34" width="42" height="34"/>
    <rect class="cell" x="0" y="68" width="42" height="34"/><rect class="cell" x="42" y="68" width="42" height="34"/><rect class="cell" x="84" y="68" width="42" height="34"/><rect class="pad" x="126" y="68" width="42" height="34"/>
    <text class="small" x="132" y="22">PAD</text>
    <text class="small" x="132" y="56">PAD</text>
    <text class="small" x="132" y="90">PAD</text>
  </g>

  <line class="arrow" x1="270" y1="195" x2="370" y2="195"/>
  <text class="math" x="287" y="178">masked_fill</text>

  <text class="txt" x="390" y="126">Softmax sonrası</text>
  <g transform="translate(402,145)">
    <rect class="ok" x="0" y="0" width="42" height="34"/><rect class="ok" x="42" y="0" width="42" height="34"/><rect class="ok" x="84" y="0" width="42" height="34"/><rect class="pad" x="126" y="0" width="42" height="34"/>
    <rect class="ok" x="0" y="34" width="42" height="34"/><rect class="ok" x="42" y="34" width="42" height="34"/><rect class="ok" x="84" y="34" width="42" height="34"/><rect class="pad" x="126" y="34" width="42" height="34"/>
    <rect class="ok" x="0" y="68" width="42" height="34"/><rect class="ok" x="42" y="68" width="42" height="34"/><rect class="ok" x="84" y="68" width="42" height="34"/><rect class="pad" x="126" y="68" width="42" height="34"/>
    <text class="small" x="139" y="22">0</text>
    <text class="small" x="139" y="56">0</text>
    <text class="small" x="139" y="90">0</text>
  </g>

  <rect class="panel" x="650" y="120" width="380" height="170"/>
  <text class="txt" x="680" y="152">Action mask örneği</text>
  <rect class="logit" x="690" y="178" width="70" height="42"/><text class="small" x="710" y="204">src 0</text>
  <rect class="logit" x="770" y="178" width="70" height="42"/><text class="small" x="790" y="204">src 1</text>
  <rect class="pad" x="850" y="178" width="70" height="42"/><text class="small" x="872" y="204">rakip</text>
  <rect class="pad" x="930" y="178" width="70" height="42"/><text class="small" x="952" y="204">boş</text>
  <text class="math" x="690" y="252">invalid logits = -inf</text>
  <text class="small" x="690" y="276">source_mask launch yapılamayan slotları eler.</text>
</svg>
