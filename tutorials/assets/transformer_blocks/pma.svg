<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">PMA Pooling by Multihead Attention</title>
  <desc id="desc">PMA uses learned seed vectors to query a set and produce invariant global summary tokens.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 12; }
      .seed { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.4; rx: 10; }
      .set { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; rx: 10; }
      .block { fill: #fef3c7; stroke: #d97706; stroke-width: 1.4; rx: 12; }
      .out { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.4; rx: 10; }
      .txt { font: 600 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .math { font: 15px "DejaVu Sans Mono", Consolas, monospace; fill: #1e293b; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1100" height="330"/>
  <rect class="panel" x="24" y="24" width="1052" height="282"/>

  <text class="txt" x="50" y="60">PMA: Pooling by Multihead Attention</text>
  <text class="small" x="50" y="86">Öğrenilen seed tokenları seti okuyup sabit sayıda global özet üretir.</text>

  <rect class="seed" x="70" y="118" width="150" height="68"/>
  <text class="txt" x="116" y="148">Seed</text>
  <text class="math" x="132" y="170">S</text>

  <rect class="set" x="70" y="220" width="150" height="58"/>
  <text class="txt" x="124" y="247">Set</text>
  <text class="math" x="132" y="268">X</text>

  <rect class="block" x="330" y="152" width="245" height="96"/>
  <text class="txt" x="396" y="184">MAB(S, X)</text>
  <text class="small" x="365" y="213">seed query, set key/value</text>
  <line class="arrow" x1="220" y1="152" x2="330" y2="178"/>
  <line class="arrow" x1="220" y1="249" x2="330" y2="220"/>

  <rect class="out" x="680" y="150" width="185" height="100"/>
  <text class="txt" x="716" y="181">Global özet</text>
  <text class="math" x="716" y="209">PMA(X)</text>
  <text class="small" x="708" y="232">1 seed ise set-to-one</text>
  <line class="arrow" x1="575" y1="200" x2="680" y2="200"/>

  <rect class="panel" x="910" y="127" width="132" height="132"/>
  <text class="txt" x="940" y="158">Garanti</text>
  <text class="math" x="925" y="190">PMA(PX)=PMA(X)</text>
  <text class="small" x="927" y="221">set-to-one invariant</text>
</svg>
