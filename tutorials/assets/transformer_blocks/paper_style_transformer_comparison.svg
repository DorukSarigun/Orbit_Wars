<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760" role="img" aria-labelledby="title desc">
  <title id="title">Paper-style diagrams for normal Transformer and Set Transformer blocks</title>
  <desc id="desc">A grayscale paper-style comparison figure showing normal Transformer encoder and decoder blocks together with Set Transformer MAB, SAB, ISAB, and PMA operations.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#111"/>
    </marker>
    <marker id="dot" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5">
      <circle cx="2.5" cy="2.5" r="2" fill="#111"/>
    </marker>
    <style>
      .paper { fill: #f7f7f7; }
      .rule { stroke: #111; stroke-width: 2; }
      .box { fill: #d0d2d5; stroke: #111; stroke-width: 1.25; }
      .inner { fill: #b6babf; stroke: #111; stroke-width: 1.15; }
      .light { fill: #ededed; stroke: #111; stroke-width: 1.05; }
      .node { fill: #fafafa; stroke: #111; stroke-width: 1.1; }
      .filled { fill: #c6c9cd; stroke: #111; stroke-width: 1.1; }
      .arrow { stroke: #111; stroke-width: 1.25; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #111; stroke-width: 1; fill: none; marker-end: url(#arrow); }
      .skip { stroke: #111; stroke-width: 1; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #111; stroke-width: 1; fill: none; stroke-dasharray: 3 3; marker-end: url(#arrow); }
      .txt { font: 15px "Times New Roman", serif; fill: #111; }
      .tiny { font: 12px "Times New Roman", serif; fill: #111; }
      .label { font: 700 18px "Times New Roman", serif; fill: #111; }
      .title { font: 700 19px "Times New Roman", serif; fill: #111; }
      .math { font: 14px "Times New Roman", serif; fill: #111; font-style: italic; }
    </style>
  </defs>

  <rect class="paper" width="1260" height="760"/>

  <!-- Normal Transformer header -->
  <text class="title" x="540" y="45">Normal Transformer</text>
  <line class="rule" x1="70" y1="58" x2="1190" y2="58"/>

  <!-- (a) Normal sequence model -->
  <g transform="translate(60,92)">
    <text class="math" x="0" y="86">X</text>
    <circle class="node" cx="42" cy="24" r="8"/>
    <circle class="node" cx="42" cy="62" r="8"/>
    <circle class="node" cx="42" cy="100" r="8"/>
    <line class="dash" x1="42" y1="35" x2="42" y2="51"/>
    <line class="dash" x1="42" y1="73" x2="42" y2="89"/>

    <rect class="light" x="72" y="4" width="56" height="116" rx="8"/>
    <text class="tiny" x="82" y="26">+ Pos</text>
    <line class="thin" x1="50" y1="24" x2="72" y2="24"/>
    <line class="thin" x1="50" y1="62" x2="72" y2="62"/>
    <line class="thin" x1="50" y1="100" x2="72" y2="100"/>

    <rect class="box" x="158" y="0" width="72" height="124" rx="8"/>
    <text class="tiny" x="172" y="58">Encoder</text>
    <text class="tiny" x="180" y="76">stack</text>
    <line class="thin" x1="128" y1="24" x2="158" y2="24"/>
    <line class="thin" x1="128" y1="62" x2="158" y2="62"/>
    <line class="thin" x1="128" y1="100" x2="158" y2="100"/>

    <rect class="light" x="266" y="4" width="56" height="116" rx="8"/>
    <text class="tiny" x="276" y="26">shifted</text>
    <text class="tiny" x="278" y="43">Y+Pos</text>

    <rect class="box" x="352" y="8" width="72" height="108" rx="8"/>
    <text class="tiny" x="368" y="54">Decoder</text>
    <text class="tiny" x="376" y="72">stack</text>
    <line class="thin" x1="322" y1="62" x2="352" y2="62"/>
    <path class="thin" d="M230 62 C260 150, 330 150, 372 116"/>

    <circle class="node" cx="464" cy="38" r="7"/>
    <circle class="node" cx="464" cy="82" r="7"/>
    <line class="thin" x1="424" y1="48" x2="457" y2="38"/>
    <line class="thin" x1="424" y1="76" x2="457" y2="82"/>
    <text class="math" x="482" y="65">Y</text>

    <text class="label" x="122" y="160">(a) Sequence-to-sequence model</text>
  </g>

  <!-- (b) Normal encoder block -->
  <g transform="translate(545,103)">
    <rect class="box" x="0" y="0" width="250" height="128" rx="8"/>
    <text class="math" x="-28" y="68">X+E</text>
    <line class="arrow" x1="-4" y1="64" x2="28" y2="64"/>

    <rect class="inner" x="34" y="22" width="58" height="84" rx="7"/>
    <text class="tiny" x="47" y="56">Multi</text>
    <text class="tiny" x="44" y="72">head</text>
    <text class="tiny" x="39" y="88">self-attn</text>

    <circle class="node" cx="112" cy="64" r="3"/>
    <line class="thin" x1="92" y1="64" x2="112" y2="64"/>
    <path class="skip" d="M18 64 C30 12, 98 12, 112 61"/>

    <text class="math" x="123" y="68">H</text>
    <line class="arrow" x1="126" y1="64" x2="155" y2="64"/>

    <rect class="inner" x="158" y="42" width="48" height="44" rx="6"/>
    <text class="tiny" x="174" y="68">FF</text>
    <circle class="node" cx="222" cy="64" r="3"/>
    <line class="thin" x1="206" y1="64" x2="222" y2="64"/>
    <path class="skip" d="M128 64 C145 114, 205 114, 222 67"/>
    <line class="arrow" x1="222" y1="64" x2="270" y2="64"/>

    <text class="label" x="18" y="166">(b) Encoder block</text>
  </g>

  <!-- (c) Normal decoder block -->
  <g transform="translate(868,92)">
    <rect class="box" x="0" y="0" width="310" height="150" rx="8"/>
    <text class="math" x="-35" y="58">Y+E</text>
    <text class="math" x="-22" y="118">Z</text>
    <line class="arrow" x1="-3" y1="54" x2="28" y2="54"/>
    <line class="arrow" x1="-3" y1="114" x2="112" y2="114"/>

    <rect class="inner" x="32" y="24" width="54" height="60" rx="7"/>
    <text class="tiny" x="44" y="46">Masked</text>
    <text class="tiny" x="42" y="63">self</text>
    <text class="tiny" x="45" y="78">attn</text>
    <circle class="node" cx="102" cy="54" r="3"/>
    <line class="thin" x1="86" y1="54" x2="102" y2="54"/>
    <path class="skip" d="M22 54 C36 8, 90 8, 102 51"/>

    <rect class="inner" x="130" y="62" width="58" height="74" rx="7"/>
    <text class="tiny" x="145" y="92">Cross</text>
    <text class="tiny" x="146" y="109">attn</text>
    <line class="thin" x1="102" y1="54" x2="130" y2="82"/>
    <line class="thin" x1="112" y1="114" x2="130" y2="114"/>
    <circle class="node" cx="206" cy="100" r="3"/>
    <line class="thin" x1="188" y1="100" x2="206" y2="100"/>
    <path class="skip" d="M104 54 C125 148, 184 148, 206 103"/>

    <rect class="inner" x="232" y="78" width="44" height="44" rx="6"/>
    <text class="tiny" x="248" y="104">FF</text>
    <line class="arrow" x1="206" y1="100" x2="232" y2="100"/>
    <line class="arrow" x1="276" y1="100" x2="330" y2="100"/>
    <text class="label" x="54" y="188">(c) Decoder block</text>
  </g>

  <!-- Set Transformer header -->
  <text class="title" x="552" y="385">Set Transformer</text>
  <line class="rule" x1="70" y1="398" x2="1190" y2="398"/>

  <!-- (d) Set model -->
  <g transform="translate(55,438)">
    <text class="math" x="0" y="86">X</text>
    <circle class="node" cx="42" cy="22" r="8"/>
    <circle class="node" cx="42" cy="60" r="8"/>
    <circle class="node" cx="42" cy="98" r="8"/>
    <line class="dash" x1="42" y1="33" x2="42" y2="49"/>
    <line class="dash" x1="42" y1="71" x2="42" y2="87"/>

    <rect class="box" x="78" y="4" width="74" height="116" rx="8"/>
    <circle class="node" cx="102" cy="28" r="6"/>
    <circle class="node" cx="128" cy="28" r="6"/>
    <circle class="node" cx="102" cy="62" r="6"/>
    <circle class="node" cx="128" cy="62" r="6"/>
    <circle class="node" cx="102" cy="96" r="6"/>
    <circle class="node" cx="128" cy="96" r="6"/>
    <line class="dash" x1="102" y1="34" x2="102" y2="90"/>
    <line class="dash" x1="128" y1="34" x2="128" y2="90"/>
    <text class="tiny" x="90" y="138">Encoder</text>

    <line class="thin" x1="50" y1="22" x2="78" y2="28"/>
    <line class="thin" x1="50" y1="60" x2="78" y2="62"/>
    <line class="thin" x1="50" y1="98" x2="78" y2="96"/>

    <rect class="light" x="188" y="4" width="56" height="116" rx="8"/>
    <circle class="node" cx="216" cy="30" r="7"/>
    <circle class="node" cx="216" cy="62" r="7"/>
    <circle class="node" cx="216" cy="94" r="7"/>
    <text class="math" x="211" y="138">Z</text>
    <path class="thin" d="M152 28 C166 12, 178 12, 188 30"/>
    <path class="thin" d="M152 62 C166 62, 178 62, 188 62"/>
    <path class="thin" d="M152 96 C166 112, 178 112, 188 94"/>

    <rect class="box" x="282" y="22" width="86" height="78" rx="8"/>
    <circle class="node" cx="315" cy="46" r="7"/>
    <circle class="node" cx="342" cy="46" r="7"/>
    <circle class="node" cx="315" cy="78" r="7"/>
    <circle class="node" cx="342" cy="78" r="7"/>
    <text class="tiny" x="303" y="120">Decoder / PMA</text>
    <line class="thin" x1="244" y1="62" x2="282" y2="62"/>
    <line class="arrow" x1="368" y1="62" x2="408" y2="62"/>

    <text class="label" x="98" y="176">(d) Set model</text>
  </g>

  <!-- (e) MAB -->
  <g transform="translate(480,430)">
    <rect class="box" x="0" y="0" width="215" height="132" rx="8"/>
    <text class="math" x="-32" y="48">X</text>
    <text class="math" x="-32" y="102">Y</text>
    <line class="arrow" x1="-4" y1="44" x2="30" y2="44"/>
    <line class="arrow" x1="-4" y1="98" x2="30" y2="98"/>
    <rect class="inner" x="36" y="22" width="58" height="88" rx="7"/>
    <text class="tiny" x="48" y="56">Multi</text>
    <text class="tiny" x="45" y="72">head</text>
    <text class="tiny" x="48" y="88">attn</text>
    <line class="thin" x1="30" y1="44" x2="36" y2="44"/>
    <line class="thin" x1="30" y1="98" x2="36" y2="98"/>
    <circle class="node" cx="112" cy="66" r="3"/>
    <line class="thin" x1="94" y1="66" x2="112" y2="66"/>
    <path class="skip" d="M22 44 C38 8, 98 10, 112 63"/>
    <text class="math" x="122" y="70">H</text>
    <line class="arrow" x1="132" y1="66" x2="154" y2="66"/>
    <rect class="inner" x="158" y="44" width="40" height="44" rx="6"/>
    <text class="tiny" x="171" y="70">FF</text>
    <line class="arrow" x1="198" y1="66" x2="236" y2="66"/>
    <text class="label" x="66" y="170">(e) MAB</text>
  </g>

  <!-- (f) SAB -->
  <g transform="translate(750,430)">
    <rect class="box" x="0" y="0" width="205" height="132" rx="8"/>
    <text class="math" x="-30" y="70">X</text>
    <line class="arrow" x1="-4" y1="66" x2="32" y2="66"/>
    <rect class="inner" x="40" y="24" width="58" height="84" rx="7"/>
    <text class="tiny" x="52" y="58">Multi</text>
    <text class="tiny" x="49" y="74">head</text>
    <text class="tiny" x="52" y="90">attn</text>
    <path class="thin" d="M30 66 C36 20, 54 20, 60 24"/>
    <path class="thin" d="M30 66 C36 110, 54 110, 60 108"/>
    <circle class="node" cx="116" cy="66" r="3"/>
    <line class="thin" x1="98" y1="66" x2="116" y2="66"/>
    <path class="skip" d="M22 66 C42 6, 100 8, 116 63"/>
    <line class="arrow" x1="130" y1="66" x2="150" y2="66"/>
    <rect class="inner" x="154" y="44" width="38" height="44" rx="6"/>
    <text class="tiny" x="167" y="70">FF</text>
    <line class="arrow" x1="192" y1="66" x2="226" y2="66"/>
    <text class="label" x="68" y="170">(f) SAB</text>
  </g>

  <!-- (g) ISAB -->
  <g transform="translate(1000,430)">
    <rect class="box" x="0" y="0" width="205" height="132" rx="8"/>
    <rect class="light" x="14" y="16" width="28" height="96" rx="8"/>
    <text class="math" x="24" y="70">I</text>
    <text class="math" x="-30" y="104">X</text>
    <line class="arrow" x1="-4" y1="100" x2="56" y2="100"/>
    <rect class="inner" x="62" y="18" width="54" height="76" rx="7"/>
    <text class="tiny" x="78" y="52">MAB</text>
    <text class="tiny" x="73" y="72">(I,X)</text>
    <line class="thin" x1="42" y1="64" x2="62" y2="46"/>
    <line class="thin" x1="56" y1="100" x2="62" y2="78"/>
    <rect class="inner" x="138" y="42" width="54" height="76" rx="7"/>
    <text class="tiny" x="154" y="76">MAB</text>
    <text class="tiny" x="149" y="96">(X,H)</text>
    <line class="thin" x1="116" y1="66" x2="138" y2="72"/>
    <path class="thin" d="M56 100 C78 128, 116 128, 138 104"/>
    <line class="arrow" x1="192" y1="80" x2="232" y2="80"/>
    <text class="label" x="66" y="170">(g) ISAB</text>
  </g>

  <!-- PMA inset -->
  <g transform="translate(800,620)">
    <rect class="box" x="0" y="0" width="280" height="78" rx="8"/>
    <rect class="light" x="14" y="12" width="46" height="54" rx="7"/>
    <text class="math" x="32" y="44">S</text>
    <text class="math" x="-26" y="44">X</text>
    <line class="arrow" x1="-2" y1="40" x2="78" y2="40"/>
    <line class="thin" x1="60" y1="40" x2="92" y2="40"/>
    <rect class="inner" x="94" y="12" width="62" height="54" rx="7"/>
    <text class="tiny" x="110" y="36">MAB</text>
    <text class="tiny" x="105" y="52">(S,X)</text>
    <line class="arrow" x1="156" y1="40" x2="202" y2="40"/>
    <circle class="node" cx="226" cy="40" r="7"/>
    <text class="math" x="242" y="45">pooled</text>
    <text class="label" x="92" y="112">(h) PMA</text>
  </g>
</svg>
